<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phantom Search · DIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── RESET ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* ── JAPANESE INK THEME ── */
  --ink:#f0ece0;
  --ink2:#d4ccb8;
  --fog:#1a1510;
  --fog2:#251f18;
  --paper:#100e0a;
  --sakura:#e8607a;
  --sakura2:rgba(232,96,122,.18);
  --indigo:#6b7fe8;
  --indigo2:rgba(107,127,232,.15);
  --gold:#d4922a;
  --gold2:rgba(212,146,42,.2);
  --text:#c8c0a8;
  --text2:#8a8070;
  --text3:#504840;
  --border:rgba(240,236,224,.07);
  --border2:rgba(240,236,224,.13);
  --shadow:rgba(0,0,0,.4);
  --shadow2:rgba(0,0,0,.65);
  --glass:rgba(240,236,224,.03);
  --glass2:rgba(240,236,224,.07);
  --glow-sakura:rgba(232,96,122,.22);
  --glow-gold:rgba(212,146,42,.18);
  --glow-indigo:rgba(107,127,232,.18);
  --serif:'Shippori Mincho',serif;
  --sans:'Inter',sans-serif;
  --jp:'Noto Serif JP',serif;
  --mono:'JetBrains Mono',monospace;
  --r:10px;--r2:16px;--r3:999px;
}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}

/* ─── BACKGROUND SYSTEM ──────────────────── */
/* Deep ink wash base — layered atmospheric depth */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% 0%,rgba(30,12,8,.0) 0%,transparent 70%),
    radial-gradient(ellipse 60% 80% at 90% 50%,rgba(232,96,122,.06) 0%,transparent 55%),
    radial-gradient(ellipse 50% 60% at 10% 80%,rgba(212,146,42,.05) 0%,transparent 55%);
}

/* Light theme background adjustments */
body.light::before{
  background:
    radial-gradient(ellipse 60% 80% at 90% 50%,rgba(196,48,80,.04) 0%,transparent 55%),
    radial-gradient(ellipse 50% 60% at 10% 80%,rgba(138,90,16,.03) 0%,transparent 55%);
}
body.light::after{opacity:.55}

/* ─── PAGE ───────────────────────────────── */
.page{
  position:relative;z-index:1;
  width:100%;max-width:760px;
  padding:0 16px 40px;
  display:flex;flex-direction:column;align-items:center;
}

/* ─── THEME TOGGLE ───────────────────────── */
.theme-toggle-wrap{
  width:100%;display:flex;justify-content:flex-end;
  padding-top:clamp(14px,3vh,24px);
  position:relative;z-index:2;
}
.theme-toggle{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r3);
  padding:7px 14px 7px 10px;
  color:var(--text2);cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  transition:background .2s,border-color .2s,color .2s;
  backdrop-filter:blur(10px);
}
.theme-toggle:hover{background:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(255,255,255,.2)}
.theme-icon{display:flex;align-items:center}
/* show/hide icons per mode */
body.light .dark-icon{display:none}
body.light .light-icon{display:flex}
body:not(.light) .dark-icon{display:flex}
body:not(.light) .light-icon{display:none}

/* ─── HEADER ─────────────────────────────── */
.hdr{
  width:100%;text-align:center;
  padding-top:clamp(16px,3vh,36px);
  margin-bottom:clamp(20px,4vh,36px);
}

/* torii gate SVG sits above logo */
.hdr-torii{
  display:flex;justify-content:center;
  margin-bottom:14px;
  opacity:.55;
}

.logo-wrap{margin-bottom:6px;position:relative}

/* main title — Shippori Mincho for dramatic Japanese serif */
.logo-phantom{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(40px,11vw,78px);
  font-weight:800;letter-spacing:-.02em;
  color:var(--ink);line-height:1;
  display:block;
  /* ink brush texture via text-shadow layering */
  text-shadow:0 0 60px rgba(232,96,122,.2),0 2px 4px rgba(0,0,0,.6);
}

/* subtitle — Noto Serif JP with wide tracking */
.logo-search{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(10px,2.8vw,15px);
  font-weight:300;letter-spacing:.5em;
  color:var(--text3);
  display:block;margin-top:6px;
  text-transform:uppercase;
}

/* brushstroke rule — asymmetric like a calligraphy stroke */
.logo-rule{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,var(--sakura) 30%,var(--gold) 70%,transparent);
  margin:14px auto 0;
  opacity:.6;
}

/* Japanese kana subtitle — shown below rule */
.hdr-kana{
  font-family:'Noto Serif JP',serif;
  font-size:11px;font-weight:300;
  color:var(--text3);letter-spacing:.3em;
  margin-top:10px;display:block;
}

.hdr-sub,.status-pill{display:none}

/* ─── SEARCH BAR ─────────────────────────── */
.search-wrap{width:100%;position:relative;max-width:600px;align-self:center}

.search-box{
  width:100%;
  display:flex;align-items:center;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:var(--r3);
  box-shadow:0 2px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
  transition:border-color .25s,box-shadow .25s;
  overflow:hidden;
  height:52px;
}
@media(min-width:480px){.search-box{height:56px}}
.search-wrap.focused .search-box{
  border-color:rgba(232,96,122,.45);
  box-shadow:0 4px 36px rgba(0,0,0,.5),0 0 0 4px rgba(232,96,122,.08),inset 0 1px 0 rgba(240,236,224,.08);
}



.s-inp{
  flex:1;background:none;border:none;outline:none;
  font-family:'Inter',sans-serif;font-size:15px;font-weight:400;
  color:var(--ink);height:100%;padding:0 4px 0 20px;
  caret-color:var(--sakura);min-width:0;
  letter-spacing:.01em;
}
.s-inp::placeholder{color:var(--text3);font-weight:300;font-family:'Noto Serif JP',serif;font-size:13px;letter-spacing:.08em}

.s-clr{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;
  color:var(--text2);cursor:pointer;
  display:none;align-items:center;justify-content:center;
  margin-right:4px;font-size:13px;flex-shrink:0;
  transition:background .2s,color .2s;
}
.s-clr.show{display:flex}
.s-clr:hover{background:rgba(255,255,255,.14);color:var(--ink)}

.s-run{
  width:44px;height:44px;margin:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--sakura),var(--gold));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .2s,transform .15s,box-shadow .2s;
  box-shadow:0 2px 16px rgba(232,96,122,.35);
}
.s-run:hover{opacity:.88;box-shadow:0 4px 24px rgba(232,96,122,.5)}
.s-run:active{transform:scale(.93)}
.s-run svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* ─── DROPDOWN ───────────────────────────── */
.dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:400;
  background:rgba(20,17,35,.85);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid rgba(255,255,255,.1);border-radius:var(--r2);
  box-shadow:0 16px 60px rgba(0,0,0,.6);
  overflow:hidden;
  max-height:0;opacity:0;
  transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .2s;
}
.dropdown.open{max-height:min(72vh,400px);opacity:1;overflow-y:auto}

/* thin top accent */
.dd-accent{
  height:2px;
  background:linear-gradient(90deg,var(--sakura),var(--gold),var(--sakura));
  background-size:200%;animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:-100%}100%{background-position:200%}}

.dd-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 16px;
  font-size:9px;letter-spacing:.2em;color:var(--text3);
  border-bottom:1px solid var(--border);
  font-family:var(--mono);
}
.dd-hdr span:last-child{
  background:var(--sakura2);border-radius:99px;
  padding:2px 8px;color:var(--ink2);font-size:9px;
}

.dd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);
  transition:background .12s;gap:12px;
}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.hi{background:rgba(255,255,255,.06)}

.dd-left{flex:1;min-width:0}
.dd-name{
  font-size:14px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dd-name.unnamed{color:var(--text3);font-style:italic;font-weight:300;font-size:13px}
.dd-erp{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px}

.dd-right{text-align:right;flex-shrink:0}
.dd-phone{font-size:12px;color:var(--gold);font-family:var(--mono);font-weight:500}

mark{
  background:none;
  color:var(--indigo);font-weight:600;
}

.dd-empty{
  padding:24px 16px;text-align:center;
  font-size:12px;color:var(--text3);letter-spacing:.08em;
}

/* scrollbar in dropdown */
.dropdown::-webkit-scrollbar{width:3px}
.dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ─── RESULTS ────────────────────────────── */
.res-wrap{width:100%;margin-top:28px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.res-meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding:0 2px;
}
.res-label{
  font-size:12px;color:var(--text2);font-weight:400;
}
.res-label strong{
  color:var(--ink);font-weight:600;font-size:18px;
  margin-right:6px;vertical-align:baseline;
}
.res-clear{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r3);
  color:var(--text2);cursor:pointer;
  padding:5px 14px;font-family:var(--sans);font-size:11px;font-weight:500;
  transition:all .2s;backdrop-filter:blur(8px);
}
.res-clear:hover{border-color:rgba(124,143,245,.4);color:var(--indigo)}

/* ─── CARDS — RECTANGULAR LIQUID ────────── */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(min-width:960px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

.card{
  position:relative;overflow:hidden;
  cursor:pointer;
  border-radius:14px;
  padding:0;
  container-type:inline-size;
  container-name:card;
  background:linear-gradient(135deg,rgba(255,255,255,.065) 0%,rgba(255,255,255,.018) 100%);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 2px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .2s cubic-bezier(.34,1.3,.64,1),box-shadow .2s,border-color .2s;
  animation:cardIn .3s ease both;
}

/* glow blobs */
.card::before{
  content:'';position:absolute;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,var(--glow-sakura),transparent 70%);
  top:-30px;right:-20px;pointer-events:none;
  transition:transform .35s ease;
}
.card::after{
  content:'';position:absolute;
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,var(--glow-gold),transparent 70%);
  bottom:-20px;left:-10px;pointer-events:none;
  transition:transform .35s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(232,96,122,.25);
  box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(232,96,122,.12),inset 0 1px 0 rgba(240,236,224,.1);
}
.card:hover::before{transform:translate(4px,-4px) scale(1.1)}
.card:hover::after{transform:translate(-4px,4px) scale(1.1)}
.card:active{transform:scale(.99)}

.card:nth-child(1){animation-delay:.02s}
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.11s}
.card:nth-child(n+5){animation-delay:.13s}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* top gradient stripe */
.card-stripe{
  height:2px;
  background:linear-gradient(90deg,var(--sakura),var(--gold));
  opacity:.7;
  border-radius:14px 14px 0 0;
}

.card-inner{
  padding:16px 18px 18px;
  position:relative;z-index:1;
}

.card-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:14px;
}

.card-name{
  font-family:'Shippori Mincho',serif;
  font-size:15px;font-weight:700;
  color:var(--ink);line-height:1.3;
  word-break:break-word;flex:1;
  letter-spacing:.02em;
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}
.card-name.unnamed{color:var(--text3);font-style:italic;font-weight:400;font-size:13px}

.card-idx{
  font-family:var(--mono);font-size:9px;
  color:rgba(240,236,224,.2);
  letter-spacing:.06em;
  background:rgba(240,236,224,.05);
  padding:2px 7px;border-radius:99px;
  flex-shrink:0;margin-left:10px;margin-top:2px;
}

.card-fields{
  display:flex;
  flex-direction:column;
  gap:8px;
}
/* wider cards get 2-col layout */
@container card (min-width:220px){
  .card-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 14px;
  }
}
.card-fields .cf-full{grid-column:1/-1}

.cf{display:flex;flex-direction:column;gap:3px;min-width:0}
.cf-label{
  font-size:8px;letter-spacing:.22em;
  color:rgba(240,236,224,.25);
  font-family:var(--mono);text-transform:uppercase;
}
.cf-val{
  font-size:12px;color:var(--ink2);
  font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cf-val.phone{
  color:var(--gold);font-weight:600;
  text-shadow:0 0 10px rgba(212,146,42,.4);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cf-val.email{color:var(--text2);font-size:11px}
.cf-val.na{color:var(--text3);font-style:italic;font-size:11px}

/* ─── MODAL — BOTTOM SHEET ON MOBILE, CENTERED ON DESKTOP ── */
.overlay{
  position:fixed;inset:0;z-index:800;
  background:rgba(4,3,14,.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(12px,4vw,20px);
  opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.overlay.open{opacity:1;pointer-events:all}

.sheet{
  background:linear-gradient(170deg,rgba(22,18,40,.98) 0%,rgba(13,10,26,.99) 100%);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 24px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09);
  width:calc(100% - 0px);max-width:420px;
  transform:scale(.92) translateY(10px);
  transition:transform .28s cubic-bezier(.34,1.2,.64,1),opacity .22s;
  overflow:hidden;
  max-height:min(92dvh,560px);overflow-y:auto;
}
.overlay.open .sheet{transform:scale(1) translateY(0)}

/* handle hidden — not a bottom sheet anymore */
.sheet-handle{display:none}

.sheet-body{padding:clamp(12px,3vw,24px) clamp(14px,4vw,24px);padding-bottom:clamp(14px,3vh,28px);position:relative}

.sheet-close{
  position:absolute;top:0;right:0;
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s,transform .18s;
}
.sheet-close:hover{background:rgba(255,255,255,.14);color:var(--ink);transform:rotate(90deg)}

.sheet-kana{
  font-family:'Noto Serif JP',serif;
  font-size:10px;font-weight:300;
  color:var(--text3);letter-spacing:.3em;margin-bottom:6px;
}

.sheet-name{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(20px,5.5vw,34px);font-weight:800;
  color:var(--ink);letter-spacing:.02em;
  margin-bottom:clamp(8px,2vh,16px);line-height:1.15;word-break:break-word;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
}

.sheet-rule{height:1px;background:linear-gradient(90deg,var(--sakura),var(--gold),transparent);opacity:.4;margin-bottom:clamp(8px,2vh,18px)}

.sheet-grid{display:flex;flex-direction:column;gap:clamp(6px,1.5vh,10px)}
@media(min-width:480px){
  .sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vh,10px)}
}

.sf{
  background:rgba(240,236,224,.03);
  border:1px solid rgba(240,236,224,.07);
  border-radius:10px;padding:clamp(8px,2vh,14px) clamp(10px,2.5vw,16px);
  transition:border-color .18s,background .18s;
}
.sf:hover{border-color:rgba(232,96,122,.2);background:rgba(240,236,224,.05)}
.sf.full{grid-column:1/-1}

.sf-label{
  font-size:8px;letter-spacing:.28em;color:var(--text3);
  font-family:var(--mono);margin-bottom:clamp(3px,1vh,7px);text-transform:uppercase;
}
.sf-val{
  font-family:'Shippori Mincho',serif;
  font-size:clamp(13px,3.8vw,16px);font-weight:600;color:var(--ink);
  word-break:break-word;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.sf-val.indigo{
  color:var(--gold);font-size:clamp(13px,4vw,18px);font-weight:700;
  text-shadow:0 0 14px rgba(212,146,42,.4);
  white-space:normal;word-break:break-word;overflow:visible;
}
.sf-val.na{color:var(--text3);font-style:italic;font-size:13px;font-weight:400}

/* ─── LOADING ────────────────────────────── */
.loader{
  margin-top:48px;text-align:center;
  font-size:11px;letter-spacing:.2em;color:var(--text3);
  font-family:var(--mono);
}
.loader-bar{width:120px;height:1px;background:var(--border);margin:14px auto 0;overflow:hidden;border-radius:99px}
.loader-fill{height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--indigo),transparent);animation:sweep 1s ease infinite}
@keyframes sweep{0%{transform:translateX(-200%)}100%{transform:translateX(500%)}}

/* ─── BOTTOM BAR ─────────────────────────── */
.bar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(40px + env(safe-area-inset-bottom));
  padding:0 20px;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,10,22,.88);
  border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:16px;z-index:600;
}
.bar-item{
  display:flex;align-items:center;gap:5px;
  font-size:9px;letter-spacing:.12em;color:var(--text3);
  font-family:var(--mono);white-space:nowrap;overflow:hidden;
}
.bar-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bar-dot.sakura{background:var(--sakura)}
.bar-dot.indigo{background:var(--gold);animation:breathe 2.5s ease .5s infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.sp{flex:1}
.bar-clock{font-size:9px;letter-spacing:.08em;color:var(--text3);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ─── DESKTOP ────────────────────────────── */
@media(min-width:600px){
  .s-inp{font-size:16px}
}
@media(min-width:860px){
  .page{padding:0 24px 40px}
}



/* ─── COPY BUTTON ────────────────────────── */
.copy-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;
  color:var(--text3);cursor:pointer;
  padding:3px 8px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  transition:all .18s;margin-left:6px;vertical-align:middle;flex-shrink:0;
}
.copy-btn:hover{border-color:var(--indigo);color:var(--indigo);background:rgba(124,143,245,.1)}
.copy-btn.copied{border-color:var(--indigo);color:var(--indigo);background:var(--indigo2)}
.copy-btn svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ─── FLOATING ORBS (ambient glow) ─────── */
.orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(60px);animation:orbdrift 18s ease-in-out infinite alternate;
}
.orb1{
  width:320px;height:320px;
  top:-80px;right:-80px;
  background:radial-gradient(circle,rgba(232,96,122,.18),transparent 70%);
  animation-duration:22s;
}
.orb2{
  width:260px;height:260px;
  bottom:80px;left:-80px;
  background:radial-gradient(circle,rgba(212,146,42,.14),transparent 70%);
  animation-duration:17s;animation-delay:-9s;
}
@keyframes orbdrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(20px,-30px) scale(1.06)}
  100%{transform:translate(-10px,20px) scale(.96)}
}

/* ─── SAKURA PETALS ─────────────────────── */
.petal{
  position:fixed;pointer-events:none;z-index:0;
  width:6px;height:6px;border-radius:40% 60% 60% 40%;
  background:rgba(232,160,180,.5);
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:0}
  10%{opacity:.6}
  90%{opacity:.3}
  100%{transform:translateY(110vh) rotate(540deg);opacity:0}
}

/* ─── GRADIENT RULE UNDER SEARCH ─────────── */
.search-glow{display:none}

/* ─── NEON MARK HIGHLIGHT ──────────────── */
mark{
  background:none;
  color:var(--sakura);font-weight:600;
}

/* ─── SHEET GRADIENT BAR ─────────────────── */
.sheet-sakura-bar{
  height:3px;
  background:linear-gradient(90deg,var(--sakura),var(--gold),var(--sakura));
  background-size:200%;
  animation:shimmer 4s linear infinite;
}

/* ─── SAKURA PETALS ─────────────────────── */
.petal{
  position:fixed;pointer-events:none;z-index:0;
  border-radius:50% 0 50% 0;
  background:radial-gradient(ellipse at 40% 40%,rgba(232,96,122,.7),rgba(212,146,42,.2));
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:0}
  8%{opacity:.7}
  85%{opacity:.4}
  100%{transform:translateY(110vh) rotate(580deg) scale(.7);opacity:0}
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ─── EMPTY STATE ────────────────────────── */
.empty{
  width:100%;text-align:center;padding:60px 20px;
  animation:fadeUp .3s ease;
}
.empty-icon{display:flex;justify-content:center;margin-bottom:14px}
.empty-msg{font-size:14px;color:var(--text3);font-weight:400;letter-spacing:-.01em}
.empty-msg em{color:var(--text2);font-style:normal;font-weight:600}

/* ─── LIGHT THEME — WASHI PARCHMENT ─────── */
body.light{
  --ink:#1a1208;
  --ink2:#2e2010;
  --fog:#f4ede0;
  --fog2:#ece5d4;
  --paper:#faf6ee;
  --sakura:#c43050;
  --sakura2:rgba(196,48,80,.1);
  --indigo:#3d50b8;
  --indigo2:rgba(61,80,184,.08);
  --gold:#8a5a10;
  --gold2:rgba(138,90,16,.15);
  --text:#3a2a18;
  --text2:#6a5040;
  --text3:#a8907a;
  --border:rgba(26,18,8,.1);
  --border2:rgba(26,18,8,.18);
  --shadow:rgba(26,18,8,.08);
  --shadow2:rgba(26,18,8,.16);
  --glass:rgba(255,255,255,.5);
  --glass2:rgba(255,255,255,.75);
  --glow-sakura:rgba(196,48,80,.1);
  --glow-gold:rgba(138,90,16,.1);
  --glow-indigo:rgba(61,80,184,.08);
}
body.light .search-box{
  background:rgba(255,255,255,.7);
  border-color:rgba(26,18,8,.15);
  box-shadow:0 2px 24px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);
}
body.light .search-wrap.focused .search-box{
  border-color:rgba(196,48,80,.4);
  box-shadow:0 4px 28px rgba(196,48,80,.1),0 0 0 4px rgba(196,48,80,.06);
}
body.light .s-inp{color:var(--ink)}
body.light .s-inp::placeholder{color:var(--text3)}
body.light .s-clr{background:rgba(26,18,8,.06)}
body.light .s-clr:hover{background:rgba(26,18,8,.1)}
body.light .dropdown{
  background:rgba(248,242,232,.97);
  border-color:rgba(26,18,8,.12);
  box-shadow:0 16px 60px rgba(0,0,0,.1);
}
body.light .dd-item:hover,body.light .dd-item.hi{background:rgba(196,48,80,.04)}
body.light .card{
  background:linear-gradient(135deg,rgba(255,252,245,.9) 0%,rgba(248,242,232,.7) 100%);
  border-color:rgba(26,18,8,.1);
  box-shadow:0 2px 16px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8);
}
body.light .card:hover{
  border-color:rgba(196,48,80,.25);
  box-shadow:0 8px 28px rgba(196,48,80,.1),0 0 0 1px rgba(196,48,80,.12);
}
body.light .card-name{text-shadow:none}
body.light .cf-label{color:rgba(26,18,8,.3)}
body.light .cf-val{color:var(--ink2)}
body.light .cf-val.phone{color:var(--gold);text-shadow:none}
body.light .sheet{
  background:linear-gradient(170deg,rgba(252,248,240,.99) 0%,rgba(246,240,228,.99) 100%);
  border-color:rgba(26,18,8,.1);
  box-shadow:0 -8px 40px rgba(0,0,0,.08);
}
body.light .sheet-name{text-shadow:none}
body.light .sf{background:rgba(255,252,245,.7);border-color:rgba(26,18,8,.09)}
body.light .sf:hover{border-color:rgba(196,48,80,.2);background:rgba(255,252,245,.9)}
body.light .sf-val.indigo{text-shadow:none;color:var(--gold)}
body.light .sheet-rule{background:linear-gradient(90deg,var(--sakura),var(--gold),transparent);opacity:.25}
body.light .sheet-kana{color:var(--text3)}
body.light .bar{background:rgba(248,244,236,.95);border-top-color:rgba(26,18,8,.1)}
body.light .theme-toggle{background:rgba(26,18,8,.05);border-color:rgba(26,18,8,.12)}
body.light .theme-toggle:hover{background:rgba(26,18,8,.09)}
body.light .orb1{background:radial-gradient(circle,rgba(196,48,80,.1),transparent 70%)}
body.light .orb2{background:radial-gradient(circle,rgba(138,90,16,.1),transparent 70%)}
body.light .res-clear{background:rgba(26,18,8,.04);border-color:rgba(26,18,8,.12)}
body.light .dd-name{color:var(--ink)}
body.light .dd-phone{color:var(--gold)}
body.light .hdr-torii{opacity:.45}
body.light .hdr-kana{color:var(--text3)}
</style>
</head>
<body>

<!-- ambient orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="page">

  <!-- ── THEME TOGGLE ── -->
  <div class="theme-toggle-wrap">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <span class="theme-icon dark-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </span>
      <span class="theme-icon light-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </span>
      <span class="theme-label" id="themeLabel">Light</span>
    </button>
  </div>

  <!-- ── HEADER ── -->
  <header class="hdr">
    <!-- Torii gate silhouette -->
    <div class="hdr-torii">
      <svg width="52" height="44" viewBox="0 0 52 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- kasagi (top crossbeam — curved upward) -->
        <path d="M2 12 Q26 4 50 12" stroke="var(--sakura)" stroke-width="3.5" stroke-linecap="round"/>
        <!-- nuki (second crossbeam) -->
        <line x1="8" y1="20" x2="44" y2="20" stroke="var(--sakura)" stroke-width="2" stroke-linecap="round" opacity=".8"/>
        <!-- left pillar -->
        <line x1="14" y1="11" x2="14" y2="44" stroke="var(--ink2)" stroke-width="2.8" stroke-linecap="round"/>
        <!-- right pillar -->
        <line x1="38" y1="11" x2="38" y2="44" stroke="var(--ink2)" stroke-width="2.8" stroke-linecap="round"/>
        <!-- shimaki caps (small vertical pieces on top beam) -->
        <line x1="14" y1="6" x2="14" y2="13" stroke="var(--sakura)" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
        <line x1="38" y1="6" x2="38" y2="13" stroke="var(--sakura)" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
    <div class="logo-wrap">
      <span class="logo-phantom">Phantom</span>
      <span class="logo-search">Search · 探偵</span>
    </div>
    <div class="logo-rule"></div>
    <span class="hdr-kana">フ ァ ン ト ム · 幻 影</span>
  </header>

  <!-- ── SEARCH ── -->
  <div class="search-wrap" id="sw">
    <div class="search-box">

      <input class="s-inp" id="si" type="text" inputmode="search"
        placeholder="Search name, ERP or phone…"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="s-clr" id="sClr" title="Clear">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l10 10M11 1L1 11"/>
        </svg>
      </button>
      <button class="s-run" id="sBtn" title="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>

    <!-- dropdown -->
    <div class="dropdown" id="dd">
      <div class="dd-accent"></div>
      <div class="dd-hdr">
        <span>SUGGESTIONS</span>
        <span id="ddCnt">0</span>
      </div>
      <div id="ddList"></div>
    </div>
  </div>

  <!-- ── RESULTS ── -->
  <div class="res-wrap" id="resWrap" style="display:none">
    <div class="res-meta">
      <div class="res-label"><strong id="resCount">0</strong> results</div>
      <button class="res-clear" id="resClear">Clear</button>
    </div>
    <div class="grid" id="resGrid"></div>
  </div>

  <!-- ── EMPTY ── -->
  <div class="empty" id="emptyEl" style="display:none">
    <div class="empty-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".3"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg>
    </div>
    <div class="empty-msg">No records for <em id="emptyQ"></em></div>
  </div>

  <!-- ── LOADING ── -->
  <div class="loader" id="loader">
    <div>Loading directory…</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

</div>

<!-- ── MODAL ── -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-sakura-bar"></div>
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <button class="sheet-close" id="shClose">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l12 12M13 1L1 13"/>
        </svg>
      </button>
      <div class="sheet-kana">Record Detail</div>
      <div class="sheet-name" id="shName"></div>
      <div class="sheet-rule"></div>
      <div class="sheet-grid">
        <div class="sf">
          <div class="sf-label">ERP ID</div>
          <div class="sf-val" id="shErp"></div>
        </div>
        <div class="sf">
          <div class="sf-label">PHONE</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0">
            <div class="sf-val indigo" id="shPhone" style="flex:1;min-width:0;word-break:break-word"></div>
            <button class="copy-btn" id="copyPhoneBtn" title="Copy phone" style="flex-shrink:0">
              <svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="11" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v9A1.5 1.5 0 003.5 14H5"/></svg>
              COPY
            </button>
          </div>
        </div>
        <div class="sf full">
          <div class="sf-label">EMAIL</div>
          <div class="sf-val" id="shEmail" style="font-size:13px;color:var(--text2)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── BOTTOM BAR ── -->
<div class="bar">
  <div class="bar-item">
    <div class="bar-dot sakura"></div>
    <span id="stMode">IDLE</span>
  </div>
  <div class="bar-item">
    <div class="bar-dot indigo"></div>
    <span id="stQ">—</span>
  </div>
  <div class="sp"></div>
  <div class="bar-clock" id="stClock"></div>
</div>

<script>
(()=>{
'use strict';
let DB=[],filtered=[],allHits=[],activeIdx=-1,dbt=null;
const MAX=8;

/* refs */
const sw      =document.getElementById('sw');
const inp     =document.getElementById('si');
const clrBtn  =document.getElementById('sClr');
const execBtn =document.getElementById('sBtn');
const ddEl    =document.getElementById('dd');
const ddList  =document.getElementById('ddList');
const ddCnt   =document.getElementById('ddCnt');
const resWrap =document.getElementById('resWrap');
const resCount=document.getElementById('resCount');
const resGrid =document.getElementById('resGrid');
const resClear=document.getElementById('resClear');
const emptyEl =document.getElementById('emptyEl');
const emptyQ  =document.getElementById('emptyQ');
const loader  =document.getElementById('loader');
const overlay =document.getElementById('overlay');
const sheet   =document.getElementById('sheet');
const shClose =document.getElementById('shClose');
const shName  =document.getElementById('shName');
const shErp   =document.getElementById('shErp');
const shPhone =document.getElementById('shPhone');
const shEmail =document.getElementById('shEmail');
const stClock =document.getElementById('stClock');

/* clock */
(function tick(){
  stClock.textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  setTimeout(tick,1000);
})();

/* load */
fetch('./data.json')
  .then(r=>r.json())
  .then(raw=>{
    DB=raw.map(o=>({
      name :String(o['Name']||'').trim(),
      erp  :String(o['ERP ID']||'').trim(),
      email:String(o['Email']||'').trim(),
      phone:String(o['Phone Numbers']||'').trim(),
      _s   :''
    }));
    DB.forEach(d=>{d._s=`${d.name} ${d.erp} ${d.email} ${d.phone}`.toLowerCase()});
    loader.style.display='none';
    inp.focus();
  })
  .catch(err=>{
    console.error(err);
    loader.innerHTML=`<div style="font-family:var(--mono);text-align:center">
      <div style="color:#c94a6a;font-size:11px;margin-bottom:10px">⚠ Open via server, not file://</div>
      <div style="background:var(--fog);border:1px solid var(--border2);border-radius:8px;padding:9px 16px;font-size:12px;color:var(--ink)">python -m http.server 8080</div>
    </div>`;
  });

/* utils */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(t,q){
  if(!t||!q)return esc(t||'');
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
const isNA=v=>!v||['not found or no access','0','null','undefined','nan'].includes(String(v).toLowerCase().trim());
const srch=q=>DB.filter(d=>d._s.includes(q.toLowerCase().trim()));

/* dropdown */
function renderDD(hits,q){
  activeIdx=-1;
  const top=hits.slice(0,MAX);
  ddCnt.textContent=hits.length>MAX?top.length+'+':hits.length;
  ddList.innerHTML=top.length
    ?top.map((r,i)=>{
        const nm=r.name?hl(r.name,q):'<span style="color:var(--text3);font-style:italic">Unnamed</span>';
        const ph=isNA(r.phone)?'—':hl(r.phone,q);
        return`<div class="dd-item" data-i="${i}">
          <div class="dd-left">
            <div class="dd-name${r.name?'':' unnamed'}">${nm}</div>
            <div class="dd-erp">${hl(r.erp,q)}</div>
          </div>
          <div class="dd-right"><span class="dd-phone">${ph}</span></div>
        </div>`;
      }).join('')
    :'<div class="dd-empty">Press Search or ↵</div>';
  filtered=top;
  ddEl.classList.add('open');
  ddList.querySelectorAll('.dd-item').forEach(el=>{
    el.addEventListener('mousedown',e=>{e.preventDefault();go(filtered[+el.dataset.i].name||filtered[+el.dataset.i].erp||q)});
    el.addEventListener('touchend',e=>{e.preventDefault();go(filtered[+el.dataset.i].name||filtered[+el.dataset.i].erp||q)});
    el.addEventListener('mouseover',()=>{
      ddList.querySelectorAll('.dd-item').forEach((e,j)=>e.classList.toggle('hi',j===+el.dataset.i));
      activeIdx=+el.dataset.i;
    });
  });
}
const closeDD=()=>{ddEl.classList.remove('open');activeIdx=-1};

/* exec search */
function go(q){
  const query=(q||inp.value||'').trim();
  if(!query){reset();return}
  inp.value=query;
  clrBtn.classList.add('show');
  closeDD();

  const hits=srch(query);
  allHits=hits;
  emptyEl.style.display='none';
  resWrap.style.display='none';

  if(!hits.length){
    emptyEl.style.display='block';
    emptyQ.textContent=query;
    return;
  }

  resCount.textContent=hits.length;

  resGrid.innerHTML=hits.map((r,i)=>{
    const nm=r.name||null;
    const ph=isNA(r.phone)?null:r.phone;
    const d=Math.min(i,12)*.025;
    return`<div class="card" data-i="${i}" style="animation-delay:${d}s">
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-top">
          <div class="card-name${nm?'':' unnamed'}">${nm?hl(nm,query):'Unnamed'}</div>
          <div class="card-idx">#${String(i+1).padStart(3,'0')}</div>
        </div>
        <div class="card-fields">
          <div class="cf"><div class="cf-label">ERP ID</div><div class="cf-val">${hl(r.erp,query)||'—'}</div></div>
          <div class="cf"><div class="cf-label">PHONE</div><div class="cf-val phone ${ph?'':'na'}">${ph?hl(ph,query):'N/A'}</div></div>
          <div class="cf cf-full"><div class="cf-label">EMAIL</div><div class="cf-val email">${hl(r.email,query)||'—'}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  resWrap.style.display='block';
  resGrid.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openSheet(allHits[+el.dataset.i])));
  inp.blur();
  setTimeout(()=>resWrap.scrollIntoView({behavior:'smooth',block:'start'}),60);
}

/* sheet */
function openSheet(item){
  shName.textContent=item.name||'(Unnamed)';
  shErp.textContent=item.erp||'—';
  const p=isNA(item.phone)?null:item.phone;
  shPhone.textContent=p||'Not available';
  shPhone.className='sf-val'+(p?' indigo':' na');
  shEmail.textContent=item.email||'—';
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
const closeSheet=()=>{overlay.classList.remove('open');document.body.style.overflow=''};
shClose.addEventListener('click',closeSheet);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});

/* clear */
function reset(){
  resWrap.style.display='none';
  emptyEl.style.display='none';
  closeDD();
}
clrBtn.addEventListener('click',()=>{inp.value='';clrBtn.classList.remove('show');reset();inp.focus()});
resClear.addEventListener('click',()=>{inp.value='';clrBtn.classList.remove('show');reset();inp.focus()});

/* input events */
inp.addEventListener('focus',()=>{
  sw.classList.add('focused');
  const q=inp.value.trim();
  if(q)renderDD(srch(q),q);
});
inp.addEventListener('blur',()=>{sw.classList.remove('focused');setTimeout(closeDD,200)});
inp.addEventListener('input',()=>{
  clrBtn.classList.toggle('show',inp.value.length>0);
  /* hide old results when user edits — prevents stale results showing */
  resWrap.style.display='none';
  emptyEl.style.display='none';
  clearTimeout(dbt);
  dbt=setTimeout(()=>{
    const q=inp.value.trim();
    if(!q){closeDD();return}
    renderDD(srch(q),q);  /* suggestions only — never auto-executes go() */
  },300);
});
inp.addEventListener('keydown',e=>{
  const items=ddList.querySelectorAll('.dd-item');
  if(e.key==='ArrowDown'){e.preventDefault();const n=Math.min(activeIdx+1,items.length-1);items.forEach((el,j)=>el.classList.toggle('hi',j===n));activeIdx=n}
  else if(e.key==='ArrowUp'){e.preventDefault();const n=Math.max(activeIdx-1,0);items.forEach((el,j)=>el.classList.toggle('hi',j===n));activeIdx=n}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(activeIdx>=0&&filtered[activeIdx])inp.value=filtered[activeIdx].name||filtered[activeIdx].erp||inp.value;
    go(inp.value);
  }
  else if(e.key==='Escape'){closeDD();closeSheet();inp.blur()}
});
execBtn.addEventListener('click',()=>go(inp.value));
ddEl.addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* copy phone */
const copyBtn=document.getElementById('copyPhoneBtn');
copyBtn.addEventListener('click',()=>{
  const val=document.getElementById('shPhone').textContent.trim();
  if(!val||val==='Not available')return;
  navigator.clipboard.writeText(val).then(()=>{
    copyBtn.classList.add('copied');
    copyBtn.innerHTML=`<svg viewBox="0 0 16 16" style="width:10px;height:10px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round"><path d="M2 8l4 4 8-8"/></svg> COPIED`;
    setTimeout(()=>{
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML=`<svg viewBox="0 0 16 16" style="width:10px;height:10px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round"><rect x="5" y="5" width="9" height="11" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v9A1.5 1.5 0 003.5 14H5"/></svg> COPY`;
    },1800);
  }).catch(()=>{});
});

/* modal close on backdrop click handled by overlay listener above */

/* swipe down to close on mobile */
let _sy=0;
sheet.addEventListener('touchstart',e=>{_sy=e.touches[0].clientY},{passive:true});
sheet.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-_sy>72)closeSheet()},{passive:true});
})();

/* sakura petals */
(()=>{
  const count=10;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='petal';
    const size=5+Math.random()*7;
    p.style.cssText=`left:${Math.random()*100}%;width:${size}px;height:${size*1.3}px;animation-duration:${12+Math.random()*16}s;animation-delay:${-Math.random()*22}s;opacity:${.25+Math.random()*.4};`;
    document.body.appendChild(p);
  }
})();

/* theme — defaults to system, user override persists */
(()=>{
  const btn=document.getElementById('themeToggle');
  const lbl=document.getElementById('themeLabel');
  const mq=window.matchMedia('(prefers-color-scheme: light)');

  function applyTheme(isLight){
    document.body.classList.toggle('light',isLight);
    lbl.textContent=isLight?'Dark':'Light';
  }

  const saved=localStorage.getItem('phantom-theme');
  if(saved){
    applyTheme(saved==='light');
  } else {
    applyTheme(mq.matches); /* use system default */
  }

  /* follow system if no manual override set */
  mq.addEventListener('change',e=>{
    if(!localStorage.getItem('phantom-theme')) applyTheme(e.matches);
  });

  btn.addEventListener('click',()=>{
    const isLight=!document.body.classList.contains('light');
    applyTheme(isLight);
    localStorage.setItem('phantom-theme',isLight?'light':'dark');
  });
})();


</script>
</body>
</html>
